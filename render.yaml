services:
  - type: web
    name: shipmate-logistics
    env: static
    buildCommand: ""
    staticPublishPath: "."
    routes:
      # Redirect old .html URLs to clean trailing slash URLs
      - type: redirect
        source: /about.html
        destination: /about/
      - type: redirect
        source: /services.html
        destination: /services/
      - type: redirect
        source: /fleet.html
        destination: /fleet/
      - type: redirect
        source: /contact.html
        destination: /contact/
      - type: redirect
        source: /privacy.html
        destination: /privacy/
      - type: redirect
        source: /terms.html
        destination: /terms/
      - type: redirect
        source: /index.html
        destination: /

      # Redirect non-slash URLs to trailing slash URLs
      - type: redirect
        source: /about
        destination: /about/
      - type: redirect
        source: /services
        destination: /services/
      - type: redirect
        source: /fleet
        destination: /fleet/
      - type: redirect
        source: /contact
        destination: /contact/
      - type: redirect
        source: /privacy
        destination: /privacy/
      - type: redirect
        source: /privacy-policy
        destination: /privacy/
      - type: redirect
        source: /privacy-policy/
        destination: /privacy/
      - type: redirect
        source: /terms
        destination: /terms/
      - type: redirect
        source: /terms-of-service
        destination: /terms/
      - type: redirect
        source: /terms-of-service/
        destination: /terms/